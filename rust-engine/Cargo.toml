[package]
name = "whisper-engine"
version = "0.1.0"
edition = "2021"
description = "On-device Whisper transcription engine for the localrecord Android app"

[lib]
name = "whisper_engine"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
# Host-only tool: keeps clap/uniffi_bindgen out of the Android build.
required-features = ["cli"]

[dependencies]
whisper-rs = { version = "0.16", features = ["log_backend"] }
uniffi = "0.32"
thiserror = "2"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[features]
default = []
# Builds the uniffi-bindgen binary (scripts/build-rust.sh enables it).
cli = ["uniffi/cli"]
# GPU-accelerated inference via ggml's Vulkan backend (Adreno on-device).
# Requires glslc on PATH at build time (NDK ships it — see scripts/env.sh).
vulkan = ["whisper-rs/vulkan"]

[profile.release]
lto = true
opt-level = 3
