[package]
name = "whisper-engine"
version = "0.1.0"
edition = "2021"
description = "On-device speech transcription engine for the localrecord Android app"

[lib]
name = "whisper_engine"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
# Host-only tool: keeps clap/uniffi_bindgen out of the Android build.
required-features = ["cli"]

[dependencies]
# Speech recognition (Parakeet) and speaker voiceprints (CAM++ embeddings).
# Prebuilt libs: static on the host, libsherpa-onnx-c-api.so +
# libonnxruntime.so on Android (scripts/build-rust.sh copies them into
# jniLibs). Recognition goes through the raw C API, src/native.rs being the
# safe layer (it catches C++ exceptions, which the sherpa-onnx crate can't).
sherpa-onnx = "1.13"
sherpa-onnx-sys = "1.13"
# Recognition results come back from sherpa-onnx's C API as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Recordings are Ogg Opus: libopus (bundled, built with CMake, linked statically).
opus = "0.4"
uniffi = "0.32"
thiserror = "2"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[build-dependencies]
# Compiles src/catch.cpp, the C++ exception barrier.
cc = "1"

[features]
default = []
# Builds the uniffi-bindgen binary (scripts/build-rust.sh enables it).
cli = ["uniffi/cli"]

[profile.release]
lto = true
opt-level = 3
